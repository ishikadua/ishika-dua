<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My 3-Column Layout</h1>

    <div class="container">

        <div class="box">
            <h2>Column 1</h2>
            <p>This is the first column.</p>
        </div>

        <div class="box">
            <h2>Column 2</h2>
            <p>This is the second column.</p>
        </div>

        <div class="box">
            <h2>Column 3</h2>
            <p>This is the third column.</p>
        </div>

    </div>

</body>
</html>
