<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Centering</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: lightblue;
            font-family: Arial, sans-serif;
        }

        .box {
            background-color: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Hello!</h1>
        <p>This box is centered vertically and horizontally.</p>
    </div>

</body>
</html>
